<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
<defs>
 <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1023"/><stop offset="1" stop-color="#160b2c"/></linearGradient>
 <linearGradient id="pe" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
 <clipPath id="pc"><rect width="440" height="200" rx="16"/></clipPath>
</defs>
<style>
.t{font:800 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#fff}
.d{font:400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#aab3e0}
.k{font:600 11.5px 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;fill:#a855f7}
.bx{transform-box:fill-box;transform-origin:center}
.in{opacity:0;animation:in .8s ease forwards} @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.sh{animation:sh 4s ease-in-out infinite} @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(500px)}}
.pk{animation:pk 2.4s ease-in-out infinite} @keyframes pk{0%{transform:translateX(0);opacity:0}10%{opacity:1}45%{transform:translateX(96px);opacity:1}50%,100%{transform:translateX(96px);opacity:0}}
.rs{animation:rs 2.4s ease-in-out infinite;opacity:0} @keyframes rs{0%,50%{transform:translateX(0);opacity:0}60%{opacity:1}95%{transform:translateX(-96px);opacity:1}100%{transform:translateX(-96px);opacity:0}}
.srv{animation:srv 2.4s ease-in-out infinite} @keyframes srv{0%,40%,60%,100%{fill-opacity:.12}50%{fill-opacity:.45}}
</style>
<g clip-path="url(#pc)">
<rect width="440" height="200" fill="url(#pg)"/>
<rect class="sh" x="0" y="0" width="120" height="200" fill="#fff" opacity=".04" transform="skewX(-20)"/>
<g transform="translate(320,100)"><rect x="-90" y="-26" width="52" height="52" rx="10" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff"/><text x="-64" y="5" text-anchor="middle" font-family="monospace" font-size="11" fill="#fff">client</text>
<rect class="srv" x="38" y="-26" width="52" height="52" rx="10" fill="#a855f7" fill-opacity=".12" stroke="#a855f7"/><text x="64" y="5" text-anchor="middle" font-family="monospace" font-size="11" fill="#fff">API</text>
<path d="M-36 -8 H36 M-36 8 H36" stroke="#3b4777" stroke-dasharray="4 4"/>
<g class="pk"><rect x="-44" y="-17" width="44" height="16" rx="8" fill="#00d4ff"/><text x="-22" y="-5" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#0b1023">GET</text></g>
<g class="rs"><rect x="0" y="1" width="44" height="16" rx="8" fill="#22c55e"/><text x="22" y="13" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#0b1023">200</text></g>
<text x="0" y="52" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b93c9">/api/posts</text></g>
<text class="t in" x="24" y="52">API Blog</text>
<text class="d in" x="24" y="82" style="animation-delay:.2s">API REST pour publier</text><text class="d in" x="24" y="102" style="animation-delay:.2s">et consulter des blogs.</text>
<g class="in" style="animation-delay:0.40s"><rect x="24" y="152" width="66.4" height="24" rx="12" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".5"/><text class="k" x="32" y="168">Node.js</text></g><g class="in" style="animation-delay:0.52s"><rect x="100.4" y="152" width="66.4" height="24" rx="12" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".5"/><text class="k" x="108.4" y="168">Express</text></g><g class="in" style="animation-delay:0.64s"><rect x="176.8" y="152" width="44.8" height="24" rx="12" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".5"/><text class="k" x="184.8" y="168">REST</text></g>
</g>
<rect x=".75" y=".75" width="438.5" height="198.5" rx="16" fill="none" stroke="url(#pe)" stroke-opacity=".7" stroke-width="1.5"/>
</svg>