<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
<defs>
 <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1023"/><stop offset="1" stop-color="#160b2c"/></linearGradient>
 <linearGradient id="pe" x1="0" x2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
 <clipPath id="pc"><rect width="440" height="200" rx="16"/></clipPath>
</defs>
<style>
.t{font:800 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#fff}
.d{font:400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#aab3e0}
.k{font:600 11.5px 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;fill:#00d4ff}
.bx{transform-box:fill-box;transform-origin:center}
.in{opacity:0;animation:in .8s ease forwards} @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.sh{animation:sh 4s ease-in-out infinite} @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(500px)}}
.mg{animation:mg 4s ease-in-out infinite} @keyframes mg{0%,100%{transform:translate(-30px,-26px)}33%{transform:translate(22px,-4px)}66%{transform:translate(-14px,24px)}}
.gauge{stroke-dasharray:157;stroke-dashoffset:157;animation:g 4s ease-out infinite} @keyframes g{0%{stroke-dashoffset:157}60%,100%{stroke-dashoffset:22}}
</style>
<g clip-path="url(#pc)">
<rect width="440" height="200" fill="url(#pg)"/>
<rect class="sh" x="0" y="0" width="120" height="200" fill="#fff" opacity=".04" transform="skewX(-20)"/>
<g transform="translate(320,100)"><g opacity=".7" stroke-linecap="round" stroke-width="5"><path d="M-70 -40 h50" stroke="#a855f7"/><path d="M-60 -24 h80" stroke="#3b4777"/><path d="M-60 -8 h60" stroke="#3b4777"/><path d="M-70 8 h40" stroke="#a855f7"/><path d="M-60 24 h90" stroke="#3b4777"/><path d="M-60 40 h50" stroke="#3b4777"/></g>
<g class="mg"><circle r="22" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-width="4"/><path d="M16 16 L32 32" stroke="#00d4ff" stroke-width="7" stroke-linecap="round"/></g>
<g transform="translate(52,-52)"><circle r="25" fill="none" stroke="#1f2a52" stroke-width="6"/><circle r="25" fill="none" stroke="#22c55e" stroke-width="6" class="gauge" transform="rotate(-90)" stroke-linecap="round"/><text y="5" text-anchor="middle" font-family="monospace" font-weight="700" font-size="13" fill="#fff">SEO</text></g></g>
<text class="t in" x="24" y="52">Contrôle SEO</text>
<text class="d in" x="24" y="82" style="animation-delay:.2s">Analyse le HTML d&#x27;une page</text><text class="d in" x="24" y="102" style="animation-delay:.2s">et note son référencement.</text>
<g class="in" style="animation-delay:0.40s"><rect x="24" y="152" width="66.4" height="24" rx="12" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-opacity=".5"/><text class="k" x="32" y="168">Node.js</text></g><g class="in" style="animation-delay:0.52s"><rect x="100.4" y="152" width="66.4" height="24" rx="12" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-opacity=".5"/><text class="k" x="108.4" y="168">Express</text></g>
</g>
<rect x=".75" y=".75" width="438.5" height="198.5" rx="16" fill="none" stroke="url(#pe)" stroke-opacity=".7" stroke-width="1.5"/>
</svg>