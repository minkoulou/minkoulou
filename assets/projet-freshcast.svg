<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
<defs>
 <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1023"/><stop offset="1" stop-color="#160b2c"/></linearGradient>
 <linearGradient id="pe" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
 <clipPath id="pc"><rect width="440" height="200" rx="16"/></clipPath>
</defs>
<style>
.t{font:800 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#fff}
.d{font:400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#aab3e0}
.k{font:600 11.5px 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;fill:#ef4444}
.bx{transform-box:fill-box;transform-origin:center}
.in{opacity:0;animation:in .8s ease forwards} @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.sh{animation:sh 4s ease-in-out infinite} @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(500px)}}
.ln{stroke-dasharray:260;stroke-dashoffset:260;animation:ln 4s ease-in-out infinite} @keyframes ln{0%{stroke-dashoffset:260}50%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.ln2{stroke-dasharray:6 6;animation:dsh 1s linear infinite} @keyframes dsh{to{stroke-dashoffset:-12}}
.pt{transform:scale(0);animation:pt 4s ease infinite} @keyframes pt{0%,40%{transform:scale(0)}50%,85%{transform:scale(1)}100%{transform:scale(0)}}
</style>
<g clip-path="url(#pc)">
<rect width="440" height="200" fill="url(#pg)"/>
<rect class="sh" x="0" y="0" width="120" height="200" fill="#fff" opacity=".04" transform="skewX(-20)"/>
<g transform="translate(320,100)"><g stroke="#1f2a52" stroke-width="1"><path d="M-80 40 H80 M-80 10 H80 M-80 -20 H80 M-80 -50 H80"/></g>
<path class="ln" d="M-80 -30 L-48 -36 L-16 -10 L16 -18 L48 14 L80 30" stroke="#ef4444" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln2" d="M-80 -20 L-48 -6 L-16 8 L16 18 L48 30 L80 36" stroke="#22c55e" stroke-width="2.5" fill="none" opacity=".8"/>
<circle class="pt bx" cx="80" cy="30" r="6" fill="#ef4444"/>
<text x="-80" y="62" font-family="monospace" font-size="11" fill="#8b93c9">pertes ↓ grâce à l'IA</text></g>
<text class="t in" x="24" y="52">FreshCast</text>
<text class="d in" x="24" y="82" style="animation-delay:.2s">Prédit les pertes alimentaires</text><text class="d in" x="24" y="102" style="animation-delay:.2s">par IA — hackathon Devpost.</text>
<g class="in" style="animation-delay:0.40s"><rect x="24" y="152" width="30.4" height="24" rx="12" fill="#ef4444" fill-opacity=".12" stroke="#ef4444" stroke-opacity=".5"/><text class="k" x="32" y="168">IA</text></g><g class="in" style="animation-delay:0.52s"><rect x="64.4" y="152" width="37.6" height="24" rx="12" fill="#ef4444" fill-opacity=".12" stroke="#ef4444" stroke-opacity=".5"/><text class="k" x="72.4" y="168">Web</text></g><g class="in" style="animation-delay:0.64s"><rect x="112.0" y="152" width="88.0" height="24" rx="12" fill="#ef4444" fill-opacity=".12" stroke="#ef4444" stroke-opacity=".5"/><text class="k" x="120.0" y="168">Supracodex</text></g>
</g>
<rect x=".75" y=".75" width="438.5" height="198.5" rx="16" fill="none" stroke="url(#pe)" stroke-opacity=".7" stroke-width="1.5"/>
</svg>