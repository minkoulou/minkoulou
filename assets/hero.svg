.line{opacity:0;animation:fade 1s 3.3s forwards, pulse 3s 4.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.loc{font:500 14px 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;fill:#8b93c9;letter-spacing:3px;opacity:0;animation:fade 1s 3.6s forwards}
@keyframes s0{0%,0.00%{opacity:0;transform:translateY(8px)}3.00%,21.00%{opacity:1;transform:translateY(0)}24.00%,100%{opacity:0;transform:translateY(-8px)}}
