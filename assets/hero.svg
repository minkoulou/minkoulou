.au1{animation:drift1 14s ease-in-out infinite} .au2{animation:drift2 18s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(160px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-180px,-20px)}}
.hi{font:500 20px 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;fill:#00d4ff;letter-spacing:2px;opacity:0;animation:fade 1s .2s forwards}
.name-s{font:900 104px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;letter-spacing:14px;fill:none;stroke:url(#txt);stroke-width:1.6;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s .4s ease forwards}
.name-f{font:900 104px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;letter-spacing:14px;fill:url(#txt);opacity:0;animation:fade 1.2s 2.3s forwards}
