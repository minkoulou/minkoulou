@keyframes fade{to{opacity:1}}
.sub{font:600 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#cbd5ff;transform-box:fill-box;transform-origin:center}
.subwrap{opacity:0;animation:fade 1s 3s forwards}
.gl{font:700 18px 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;opacity:.0;animation:float 6s ease-in-out infinite, fade .1s 0s forwards}
