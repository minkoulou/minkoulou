<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070f"/><stop offset=".55" stop-color="#0b1236"/><stop offset="1" stop-color="#170a2b"/></linearGradient>
 <radialGradient id="au1"><stop offset="0" stop-color="#00d4ff" stop-opacity=".35"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="au2"><stop offset="0" stop-color="#a855f7" stop-opacity=".35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
 <linearGradient id="tail" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <linearGradient id="txt" y1="0" y2="0" gradientUnits="userSpaceOnUse" x1="200" x2="800">
  <stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a855f7"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;300 0;-300 0" dur="8s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="cm" x1="0" x2="1"><stop offset="0" stop-color="#007a5e" stop-opacity="0"/><stop offset=".2" stop-color="#007a5e"/><stop offset=".5" stop-color="#ce1126"/><stop offset=".8" stop-color="#fcd116"/><stop offset="1" stop-color="#fcd116" stop-opacity="0"/></linearGradient>
